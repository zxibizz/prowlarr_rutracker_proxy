name: Image

# Every push to main publishes an image to GHCR; pull requests only build it.
# Tags: `main`, `sha-<short>`, `main-<YYYYMMDDhhmmss>-<short>` and, for a v* git tag,
# the version. The timestamped tag sorts by build time, which is what Flux image
# automation in the homelab cluster follows to roll out new builds by digest.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q proxy scripts
      - run: python -m unittest discover -s tests -v

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=main-{{date 'YYYYMMDDHHmmss'}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=prowlarr_rutracker_proxy
            org.opencontainers.image.description=Reverse proxy that makes Prowlarr's RuTracker indexer work through SOCKS5 and FlareSolverr

      # Load locally first so the smoke test runs against exactly what gets pushed.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: rutracker-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (non-root, read-only rootfs, /healthz answers)
        run: |
          docker run -d --name smoke --read-only --tmpfs /data:uid=1000,gid=1000 \
            -e HEALTH_PROBE_URL= -e FLARESOLVERR_URL= -p 8790:8790 rutracker-proxy:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8790/healthz && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - id: push
        name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image"
            echo '```'
            echo "ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
